<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세션 캐릭터</title>
<meta property="og:title" content="세션 캐릭터">
<meta property="og:type" content="website">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root{
    --ink:#0a0a0a; --paper:#ffffff; --line:#111111; --hair:#e2e2e2;
    --mute:#8a8a8a; --tint:#f5f5f5; --radius:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;
    background:#FCFCFC; color:var(--ink); line-height:1.6;
    padding:48px 20px 80px; letter-spacing:-0.01em;
  }
  .page-head{
    max-width:1200px; margin:0 auto 40px; display:flex; align-items:baseline;
    justify-content:space-between; border-bottom:2px solid var(--line);
    padding-bottom:16px; flex-wrap:wrap; gap:8px;
  }
  .page-head h1{font-size:22px;font-weight:800;letter-spacing:-0.02em}
  .page-head .sub{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}

  /* 모바일 전용 요약 바 */
  .summary{display:none}
  @media (max-width:760px){
    .summary{
      display:block; max-width:1200px; margin:0 auto 24px;
    }
    .summary-count{
      font-size:12px; font-weight:500; color:var(--mute);
      letter-spacing:-0.01em; margin-bottom:10px;
    }
    .summary-chips{display:flex; flex-wrap:wrap; gap:6px}
    .chip{
      font-size:16px; font-weight:500; white-space:nowrap;
      padding:8px 14px; border-radius:8px; cursor:pointer;
      font-family:inherit;
      background:#FCFCFC; color:#1A1A1A; border:2px solid #fff;
      box-shadow:0 4px 16px rgba(0,0,0,0.08);
      transition:background .1s, color .1s;
      -webkit-tap-highlight-color:transparent;
      -webkit-appearance:none; appearance:none;
    }
    .chip:focus{outline:none}
    .chip:focus-visible{outline:2px solid #0d0d0d; outline-offset:2px}
    .chip:active{
      background:#0d0d0d; color:#FCFCFC;
      box-shadow:none;
    }
    .chip.chip-empty{color:#999999}
    .chip.chip-empty:active{color:#FCFCFC}
  }

  .grid{
    max-width:1200px; margin:0 auto; display:grid;
    grid-template-columns:repeat(3,1fr); gap:28px;
  }
  @media (max-width:1000px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:760px){ .grid{grid-template-columns:1fr; gap:12px} body{padding:32px 16px 64px} }

  .card{
    background:#FCFCFC; border-radius:12px; border:2px solid #fff;
    box-shadow:0 4px 16px rgba(0,0,0,0.08);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .card-top{
    padding:24px 24px 20px; border-bottom:1px solid var(--hair);
    display:flex; flex-direction:column;
  }
  .id-row{
    display:flex; align-items:center; gap:16px; margin-top:16px;
  }
  .avatar{
    flex:0 0 auto; width:60px; height:60px; border-radius:50%;
    object-fit:cover; background:var(--tint); border:1px solid var(--hair);
  }
  .avatar-fallback{
    flex:0 0 auto; width:60px; height:60px; border-radius:50%;
    background:var(--ink); color:#fff; display:flex; align-items:center;
    justify-content:center; font-size:24px; font-weight:800;
  }
  .char-name{
    min-width:0; flex:1;
    font-size:22px; font-weight:700; letter-spacing:-0.03em; line-height:1.15;
    word-break:keep-all; color:#0d0d0d;
  }
  .char-name .latin{
    display:block; font-size:14px; font-weight:500; color:var(--mute);
    margin-top:4px; letter-spacing:0;
  }
  .player{
    font-size:12px; font-weight:600; color:var(--mute);
    white-space:nowrap; letter-spacing:0;
  }
  .player .pk{font-weight:500;color:#b5b5b5;margin-right:3px}

  .stats{padding:14px 24px 2px}
  .stat{
    display:flex; align-items:baseline; padding:7px 0;
    border-bottom:1px dotted var(--hair); font-size:14px;
  }
  .stat:last-child{border-bottom:none}
  .stat .k{
    flex:0 0 130px; color:var(--mute); font-weight:500; font-size:14px;
    letter-spacing:0; word-break:keep-all;
  }
  .stat .v{flex:1;font-weight:600;font-size:14px;word-break:keep-all;color:#1a1a1a}
  .name-empty{color:#c8c8c8;font-weight:700}
  .stat.empty{
    color:var(--mute); font-size:13px; font-weight:500;
    border-bottom:none; padding:4px 0 72px;
  }

  .lore{margin:16px 24px 22px}
  .lore-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    height:48px; padding:0 14px; background:#F5F7F7; border:none; border-radius:8px;
    cursor:pointer; font-family:inherit; font-size:14px; font-weight:500; color:#1a1a1a;
    -webkit-tap-highlight-color:transparent;
  }
  .lore-toggle .chev{font-size:18px; color:var(--mute); transition:transform .2s}
  .lore-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .lore-panel{
    display:grid; grid-template-rows:0fr; margin-top:0;
    transition:grid-template-rows .28s ease, margin-top .28s ease;
  }
  .lore-panel.open{grid-template-rows:1fr; margin-top:8px}
  .lore-panel-inner{
    overflow:hidden; min-height:0; position:relative;
    border-radius:8px; background:#F5F7F7;
  }
  .copy-btn{
    position:absolute; top:8px; right:8px; z-index:2; display:flex; align-items:center;
    justify-content:center; width:28px; height:28px; padding:0; border:1px solid var(--hair);
    background:var(--paper); color:var(--mute); border-radius:var(--radius); cursor:pointer;
    transition:background .12s,color .12s,border-color .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .copy-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .copy-btn.done{background:var(--ink);color:#fff;border-color:var(--ink)}
  .copy-btn .ic-copy{display:block}
  .copy-btn .ic-done{display:none}
  .copy-btn.done .ic-copy{display:none}
  .copy-btn.done .ic-done{display:block}
  .lore-body{
    padding:14px 40px 16px 14px; font-size:16px; line-height:1.72;
    white-space:pre-wrap; word-break:keep-all; color:#333333; letter-spacing:-0.1px;
  }
  .footer{
    max-width:1200px; margin:44px auto 0; text-align:center;
    font-size:11.5px; color:var(--mute); letter-spacing:0.02em;
  }
  .copy-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .lore-toggle:focus{outline:none}
  .lore-toggle:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* 복사 완료 토스트 */
  .toast{
    position:fixed; left:50%; top:24px; transform:translateX(-50%) translateY(-12px);
    display:flex; align-items:center; gap:10px;
    padding:11px 18px 11px 12px; border-radius:22px;
    background:rgba(0,0,0,0.4); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    color:#FCFCFC; font-size:14px; font-weight:500; letter-spacing:-0.01em; white-space:nowrap;
    box-shadow:0 6px 24px rgba(0,0,0,0.18);
    opacity:0; pointer-events:none; z-index:1000;
    transition:opacity .22s ease, transform .22s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast-icon{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%;
    background:#FCFCFC; display:flex; align-items:center; justify-content:center;
  }
  .state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; min-height:70vh; text-align:center;
    color:var(--mute); font-size:14px; font-weight:500;
  }
  .spinner{
    width:28px; height:28px; border-radius:50%;
    border:3px solid #F5F7F7; border-top-color:#c4c8c8;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

  <div class="summary" id="summary"></div>
  <main class="grid" id="grid"></main>
  <div id="state" class="state"><div class="spinner"></div><span>데이터 불러오는 중...</span></div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </span>
    <span>복사되었습니다.</span>
  </div>

<script>
  // ↓↓↓ 여기에 Apps Script 웹 앱 URL을 붙여넣으세요 (form.html과 같은 URL) ↓↓↓
  const API_URL = 'https://script.google.com/macros/s/AKfycbwSENaCv0EP_3Q59o027SeUAL48NskSZvNSz97NJ6MSpfnd3ZJi35hF34Ycl2vfCLVl-w/exec';

  const grid=document.getElementById("grid");

  let toastTimer=null;
  function showToast(){
    const t=document.getElementById("toast");
    if(!t) return;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
  }

  function escapeHtml(str){
    return String(str==null?'':str).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
  }
  function statRow(k,v){
    return `<div class="stat"><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(v)}</span></div>`;
  }
  function initial(name){
    const t=(name||'').trim();
    return t? t[0] : '?';
  }

  function render(list){
    const state=document.getElementById("state");
    if(!list.length){ state.textContent='아직 등록된 캐릭터가 없어요.'; return; }
    state.style.display='none';

    list.forEach((c,i)=>{
      const el=document.createElement("article");
      el.className="card";
      el.id="card-"+i;

      const nameHtml=c.name
        ? `${escapeHtml(c.name)}${c.latin?`<span class="latin">${escapeHtml(c.latin)}</span>`:""}`
        : `<span class="name-empty">미정</span>`;

      const avatarHtml=c.imageUrl
        ? `<img class="avatar" src="${escapeHtml(c.imageUrl)}" alt="" onerror="this.remove()">`
        : "";

      // stats 조립 (값 있는 것만)
      const rows=[];
      if(c.race) rows.push(statRow("종족",c.race));
      if(c.charClass) rows.push(statRow("클래스",c.charClass));
      if(c.background) rows.push(statRow("배경",c.background));
      if(c.extraSkill) rows.push(statRow("희망 추가 기술숙련",c.extraSkill));
      const statsHtml=rows.length? rows.join("") : `<div class="stat empty">아직 작성되지 않았습니다.</div>`;

      const loreHtml=c.lore
        ? `<div class="lore">
            <button class="lore-toggle" type="button" aria-expanded="false">
              <span class="lore-toggle-label">캐릭터 설명 펼치기</span>
              <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="lore-panel">
              <div class="lore-panel-inner">
                <button class="copy-btn" type="button" aria-label="캐릭터 설명 복사" title="복사">
                  <svg class="ic-copy" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  <svg class="ic-done" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </button>
                <div class="lore-body">${escapeHtml(c.lore)}</div>
              </div>
            </div>
          </div>`
        : "";

      el.innerHTML=`
        <div class="card-top">
          <div class="player"><span class="pk">PLAYER</span>${escapeHtml(c.player||"")}</div>
          <div class="id-row">
            ${avatarHtml}
            <div class="char-name">${nameHtml}</div>
          </div>
        </div>
        <div class="stats">${statsHtml}</div>
        ${loreHtml}
      `;
      grid.appendChild(el);

      if(c.lore){
        const toggle=el.querySelector(".lore-toggle");
        const panel=el.querySelector(".lore-panel");
        const label=el.querySelector(".lore-toggle-label");
        toggle.addEventListener("click",()=>{
          const open=panel.classList.toggle("open");
          toggle.setAttribute("aria-expanded",String(open));
          label.textContent=open? "캐릭터 설명 접기" : "캐릭터 설명 펼치기";
        });

        const btn=el.querySelector(".copy-btn");
        btn.addEventListener("click",async(e)=>{
          e.stopPropagation();
          try{ await navigator.clipboard.writeText(c.lore); }
          catch(err){
            const ta=document.createElement("textarea");
            ta.value=c.lore; document.body.appendChild(ta);
            ta.select(); document.execCommand("copy"); ta.remove();
          }
          btn.classList.add("done");
          setTimeout(()=>btn.classList.remove("done"),1400);
          showToast();
        });
      }
    });

    buildSummary(list);
  }

  function buildSummary(list){
    const summary=document.getElementById("summary");
    if(!list.length){ summary.innerHTML=""; return; }

    const chips=list.map((c,i)=>{
      const hasName=c.name&&c.name.trim();
      const label=hasName? c.name.trim() : "미정";
      return `<button class="chip${hasName?"":" chip-empty"}" type="button" data-target="card-${i}">${escapeHtml(label)}</button>`;
    }).join("");

    summary.innerHTML=`
      <div class="summary-count">${list.length}명 등록됨</div>
      <div class="summary-chips">${chips}</div>
    `;

    const chipEls=summary.querySelectorAll(".chip");
    chipEls.forEach(chip=>{
      chip.addEventListener("click",()=>{
        const target=document.getElementById(chip.dataset.target);
        if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
      });
    });
  }

  async function load(){
    const state=document.getElementById("state");
    const party=new URLSearchParams(window.location.search).get('party')||'';
    try{
      const url=party? API_URL+'?party='+encodeURIComponent(party) : API_URL;
      const res=await fetch(url);
      const list=await res.json();
      render(list);
    }catch(err){
      state.textContent='일시적 오류예요. 페이지를 새로고침해 주세요.';
    }
  }
  load();
</script>
</body>
</html>
